<!DOCTYPE html>

<html lang="ru-RU">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="http://localhost:5500/assets/favicon.svg">

  <title>Tracker</title>
  <meta name="description" content="Платформа для мониторинга.">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="base-cnt">
    <main class="main">
      <div class="login">
        <div class="login-title">
          <div class="login-logo">
            <img alt="logo" src="./assets/logo.svg">
          </div>
          <div>
            <h2>
              Войти в Tracker
            </h2>
          </div>
        </div>
        <form class="login-form">
          <div class="login-email">
            <div class="login-email-title">
              Email:
            </div>
            <input type="email" placeholder="Введите email" name="email" autocomplete="email" autocorrect="off"
              autofocus="autofocus" required="required">
          </div>
          <div class="login-password">
            <div class="login-password-title">
              Password:
            </div>
            <input type="password" placeholder="Введите пароль" name="password" autocomplete="current-password"
              autocorrect="off" autofocus="autofocus" required="required">
          </div>
          <div class="login-interaction">
            <button class="login-btn" type="submit" name="commit" autofocus="autofocus">
              Войти
            </button>
            <a class="forget-password-btn" href="./null.html">
              Забыл пароль?
            </a>
          </div>
        </form>
      </div>
    </main>

      <footer class="footer">
        <div class="footer-langs">
          <ul>
            <li>
              <button class="current-lang">
                Россия
              </button>
            </li>
            <li><a href="http://localhost:5500/null.html">English (US)</a></li>
            <li><a href="http://localhost:5500/null.html">Русский</a></li>
          </ul>
        </div>
        <div class="footer-other">
          <p class="copyright">
            <span dir="ltr">
              <span dir="auto">Copyright © 2025</span>
              <a rel="license">Loek Inc.</a>
              <span dir="auto">Все права защищены.</span>
            </span>
          </p>
          <ul class="other-links">
            <li><a href="http://localhost:5500/null.html" rel="bookmark" dir="auto">Условия пользования
                интернет-сервисами</a></li>
            <li><a href="http://localhost:5500/null.html" rel="bookmark" dir="auto">Конфиденциальность</a>
            </li>
            <li><a href="http://localhost:5500/null.html" rel="bookmark" dir="auto">Предупреждение об использовании
                файлов
                cookie</a></li>
            <li><a href="http://localhost:5500/null.html" rel="help" dir="auto">Служба поддержки</a></li>
            <li><a href="http://localhost:5500/null.html" rel="contact" dir="auto">Обратная связь</a></li>
          </ul>
        </div>
      </footer>
    </div>
</body>
</html>
